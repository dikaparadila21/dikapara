<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi Wajah SMA Negeri 1 Sukoharjo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand-block">
        <div>
          <p class="eyebrow">ABSENSI WAJAH</p>
          <h1>SMA Negeri 1 Sukoharjo</h1>
        </div>
        <img src="school-logo.svg" alt="Logo Sekolah" class="school-logo" />
      </div>
    </header>

    <main class="card">
      <section class="form-block">
        <label for="nama">Nama Mahasiswa</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap" autocomplete="off" />

        <div class="camera-actions">
          <button id="btnStart" class="btn btn-primary">Aktifkan Kamera</button>
          <button id="btnStop" class="btn btn-danger" disabled>Matikan Kamera</button>
          <button id="btnCapture" class="btn btn-secondary" disabled>Ambil Foto</button>
          <button id="btnSubmit" class="btn btn-success" disabled>Absen Masuk</button>
        </div>
      </section>

      <section class="preview-block">
        <div class="video-card">
          <video id="video" autoplay muted playsinline></video>
          <div class="video-label">Preview Kamera</div>
        </div>

        <div class="photo-card">
          <div class="photo-label">Foto Wajah</div>
          <img id="photoPreview" alt="Preview Foto" />
        </div>
      </section>

      <section class="attendance-log">
        <div class="attendance-header">
          <h2>Daftar Absensi Terakhir</h2>
          <p>Hasil absensi tersimpan di browser dan dikirim ke spreadsheet.</p>
        </div>
        <div class="attendance-table-wrap">
          <table class="attendance-table">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Tanggal</th>
                <th>Jam</th>
                <th>Foto</th>
              </tr>
            </thead>
            <tbody id="attendanceRows">
              <tr><td colspan="4" class="empty-state">Belum ada data absensi</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="info-panel">
        <div class="info-grid">
          <div>
            <span>Tanggal</span>
            <strong id="tanggal">-</strong>
          </div>
          <div>
            <span>Jam</span>
            <strong id="jam">-</strong>
          </div>
        </div>
        <div class="hint">Data akan dikirim ke Google Spreadsheet melalui Google Apps Script.</div>
      </section>
    </main>

    <div id="toast" class="toast"></div>
  </div>

  <canvas id="captureCanvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
